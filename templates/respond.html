<!DOCTYPE html>
<html>
<head>
<title>Blood Request Response</title>

<style>

body{
font-family: Arial, sans-serif;
background: linear-gradient(135deg,#ff4b2b,#ff416c);
min-height:100vh;
display:flex;
justify-content:center;
align-items:flex-start;
padding-top:40px;
margin:0;
}

.container{
background:white;
padding:35px;
width:420px;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{
text-align:center;
color:#d90429;
margin-bottom:25px;
}

h3{
text-align:center;
background:#ffe5e5;
padding:8px;
border-radius:6px;
color:#b00020;
}

label{
font-weight:bold;
display:block;
margin-top:12px;
}

input{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:6px;
font-size:14px;
}

input:focus{
outline:none;
border-color:#ff416c;
box-shadow:0 0 5px rgba(255,65,108,0.4);
}

button{
width:100%;
margin-top:20px;
padding:12px;
background:#d90429;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#9d0208;
}

</style>

</head>

<body>

<div class="container">

<h2>🩸 Blood Request Response</h2>

<form method="POST">

<label>Hospital Name</label>
<input type="text" name="hospital" placeholder="Enter hospital name">

<label>Patient Name</label>
<input type="text" name="patient" placeholder="Enter patient name">

<label>Required Blood Group</label>
<input type="text" name="blood_needed" placeholder="Example: O+">

<h3>Donor Details</h3>

<label>Donor Name</label>
<input type="text" name="donor_name" placeholder="Enter donor name">

<label>Donor Phone</label>
<input type="text" name="donor_phone" placeholder="Enter phone number">

<label>Donor Blood Group</label>
<input type="text" name="donor_blood" placeholder="Example: A+">

<button type="submit">Respond</button>
return redirect(url_for("confirmation"))
</form>

</div>

</body>
</html>
