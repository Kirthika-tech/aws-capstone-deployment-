<!DOCTYPE html>
<html>
<head>

<title>Respond Submitted</title>

<style>

body{
font-family:Arial;
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff4b2b,#ff416c);
}

.card{
background:white;
width:450px;
padding:40px;
border-radius:15px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

h2{
color:#d90429;
}

.info{
margin-top:20px;
text-align:left;
line-height:2;
}

button{
margin-top:25px;
width:100%;
padding:14px;
border:none;
background:#d90429;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#9d0208;
}

</style>

</head>

<body>

<div class="card">

<h2>🩸 Blood Respond Submitted</h2>

<div class="info">

<p><b>Hospital:</b> {{hospital}}</p>
<p><b>Patient:</b> {{patient}}</p>
<p><b>Required Blood:</b> {{blood}}</p>

<hr>

<p><b>Donor:</b> {{donor}}</p>
<p><b>Phone:</b> {{phone}}</p>
<p><b>Blood Group:</b> {{donorblood}}</p>

</div>

<button onclick="window.location.href='/dashboard'">
Go to Dashboard
</button>

</div>

</body>
</html>
