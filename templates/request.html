<!DOCTYPE html>
<html>
<head>
<title>Blood Request</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#ff4d4d,#990000);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

/* Form Card */

.container{
width:420px;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 15px 35px rgba(0,0,0,0.3);
animation:fadein 0.8s;
}

@keyframes fadein{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

h2{
text-align:center;
color:#b30000;
margin-bottom:25px;
}

/* Labels */

label{
font-weight:bold;
font-size:14px;
color:#444;
}

/* Inputs */

input,select{
width:100%;
padding:10px;
margin:8px 0 18px 0;
border:1px solid #ccc;
border-radius:8px;
outline:none;
transition:0.3s;
}

input:focus,select:focus{
border-color:#ff1a1a;
box-shadow:0 0 8px rgba(255,0,0,0.4);
}

/* Button */

button{
width:100%;
padding:12px;
background:linear-gradient(to right,#ff1a1a,#b30000);
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

/* Flash message */

.message{
text-align:center;
color:green;
margin-bottom:15px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h2>🩸 Blood Request Form</h2>

{% with messages = get_flashed_messages() %}
{% if messages %}
{% for message in messages %}
<div class="message">{{ message }}</div>
{% endfor %}
{% endif %}
{% endwith %}

<form method="POST">

<label>Patient Name</label>
<input type="text" name="patient_name" required>

<label>Hospital Name</label>
<input type="text" name="hospital_name" required>

<label>Blood Group</label>
<select name="blood_group">
<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>O+</option>
<option>O-</option>
<option>AB+</option>
<option>AB-</option>
</select>

<label>Units Needed</label>
<input type="number" name="units" required>

<label>Contact Number</label>
<input type="text" name="contact" required>

<button type="submit">Submit Blood Request</button>

</form>

</div>

</body>
</html>
