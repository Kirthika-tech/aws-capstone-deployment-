<!DOCTYPE html>
<html>
<head>
<title>Register Donor</title>
<style>
body{font-family:Arial;background:#f4f4f4;padding:50px;}
.container{
max-width:500px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}
h2{text-align:center;color:#d32f2f;}
input,select{
width:100%;
padding:10px;
margin:10px 0;
border-radius:5px;
border:1px solid #ccc;
}
button{
background:#d32f2f;
color:white;
padding:12px;
border:none;
border-radius:5px;
width:100%;
cursor:pointer;
}
button:hover{background:#b71c1c;}
</style>
</head>

<body>

<div class="container">
<h2>🩸 Register Blood Donor</h2>

<form method="POST">

<label>Donor Name</label>
<input type="text" name="name" required>

<label>Email ID</label>
<input type="email" name="email" required>

<label>Phone Number</label>
<input type="text" name="phone" required>

<label>Blood Group</label>
<select name="blood_group" required>
<option value="">Select</option>
<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>O+</option>
<option>O-</option>
<option>AB+</option>
<option>AB-</option>
</select>

<label>Last Blood Donation Date</label>
<input type="date" name="last_donation">

<button type="submit">Register Donor</button>

</form>

</div>

</body>
</html>
